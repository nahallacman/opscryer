# SPDX-License-Identifier: Apache-2.0
# docker-compose.yml — OpsCryer + Backstage two-container integration test.
#
# Spins up two containers on a shared Docker network:
#   - opscryer:  Python browser (opscryer_browser.py) on :8088
#   - backstage: Backstage 2.0 app with the OpsCryer frontend plugin
#
# The Backstage iframe points to http://opscryer:8088 via the
# integrations.opscryer[].baseUrl config (OPSCRYER_BROWSER_URL env var).
#
# Prerequisites:
#   - Backstage 2.0 app repo checked out at ../../backstage-2.0
#     relative to this file (i.e. sibling checkout to the OpsCryer repo).
#
# Usage:
#   docker compose up --build
#   Then open http://localhost:3001/opscryer
#
version: "3.8"

services:
  opscryer:
    build:
      context: .
      dockerfile: Dockerfile.opscryer
    container_name: opscryer-browser
    ports:
      - "8089:8088"
    networks:
      - opscryer-backstage
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backstage:
    build:
      context: ../../backstage-2.0
      dockerfile: Dockerfile.backstage
    container_name: backstage-opscryer
    ports:
      - "3001:3000"
      - "7007:7007"
    depends_on:
      opscryer:
        condition: service_healthy
    environment:
      # Point Backstage at the OpsCryer browser container via Docker DNS
      - OPSCRYER_BROWSER_URL=http://opscryer:8088
    networks:
      - opscryer-backstage

networks:
  opscryer-backstage:
    driver: bridge
