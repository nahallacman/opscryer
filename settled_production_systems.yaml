      openbao_ui: "https://openbao.cluster.example.org/ui/vault/secrets"
      openbao_health: "https://openbao.cluster.example.org/v1/sys/health"
    human_monitoring_links:
      grafana_dashboard_url: "https://grafana.cluster.example.org/d/k8s-system-openbao?var-namespace=iam&var-service=openbao&from=now-1h&to=now"
      gitlab_source_and_pipelines_url: "https://gitlab.cluster.example.org/platform/infra-gitops/-/tree/main/infrastructure/openbao?system=openbao"
      herdr_agent_pane_link: "herdr://attach/subagent-flash38-kg-01?system=openbao&cmd=hc+attach+subagent-flash38-kg-01"
      dependency_analyzer_url: "https://dependencies.cluster.example.org/?focusNode=sys-openbao&system=openbao&view=blast-radius"
      argocd_application_url: "https://argocd.cluster.example.org/applications/argocd/openbao?view=tree&system=openbao"
      security_dashboard_url: "https://opscryer.cluster.example.org/secops?system=openbao&namespace=iam&scanner=openbao-kms-audit"
      live_opscryer_debug_url: "https://opscryer.cluster.example.org/api/v1/system-context?system=openbao&namespace=iam&debug=1"
    downstream_system_ids: ["authentik", "harbor", "gitlab"]
    playbooks:
      - playbook_id: "openbao-sealed-or-externalsecret-sync-error"
        title: "OpenBao Replica Sealed or ExternalSecret Sync Failure"
        symptom_keywords: ["sealed", "externalsecret", "secret sync", "vault unseal", "external-secrets"]
        solution_summary: "An OpenBao replica is sealed after pod restart or the ExternalSecret key path under kv/data/homelab/ is out of sync."
        remediation_steps: ["Inspect OpenBao pod readiness in namespace iam and check /v1/sys/health.", "Unseal sealed OpenBao replicas using scripts/vault/unseal-openbao.ps1 and verify external-secrets pods in kube-system."]
        explicit_commands: ["kubectl get pods -n iam -l app.kubernetes.io/name=openbao", "kubectl get externalsecrets.external-secrets.io -A", "pwsh -File scripts/vault/unseal-openbao.ps1"]
        required_it_tickets: ["IT-SEC-OPENBAO-01"]
  - system_id: "argocd"
    label: "ArgoCD GitOps Controller & Application Set Engine"
    domain: "processes_workflows"
    epoch_introduced: 1
    k8s_namespace: "argocd"
    argocd_app: "argocd"
    git_manifest_path: "infrastructure/argocd"
    primary_url: "https://argocd.cluster.example.org/applications"
    control_plane_urls:
      applications: "https://argocd.cluster.example.org/applications"
      healthz: "https://argocd.cluster.example.org/healthz"
    human_monitoring_links:
      grafana_dashboard_url: "https://grafana.cluster.example.org/d/k8s-system-argocd?var-namespace=argocd&var-service=argocd&from=now-1h&to=now"
      gitlab_source_and_pipelines_url: "https://gitlab.cluster.example.org/platform/infra-gitops/-/tree/main/infrastructure/argocd?system=argocd"
      herdr_agent_pane_link: "herdr://attach/subagent-flash38-kg-01?system=argocd&cmd=hc+attach+subagent-flash38-kg-01"
      dependency_analyzer_url: "https://dependencies.cluster.example.org/?focusNode=sys-argocd&system=argocd&view=blast-radius"
      argocd_application_url: "https://argocd.cluster.example.org/applications/argocd/argocd?view=tree&system=argocd"
      security_dashboard_url: "https://opscryer.cluster.example.org/secops?system=argocd&namespace=argocd&scanner=gitops-drift"
      live_opscryer_debug_url: "https://opscryer.cluster.example.org/api/v1/system-context?system=argocd&namespace=argocd&debug=1"
    downstream_system_ids: ["gitlab", "authentik", "harbor", "openbao", "opscryer_hud"]
    playbooks:
      - playbook_id: "argocd-presync-redis-secret-init-hook-stuck"
        title: "ArgoCD PreSync Hook argocd-redis-secret-init Stuck or Chart.lock Drift"
        symptom_keywords: ["argocd-redis-secret-init", "presync hook", "chart.lock", "comparisonerror", "outofsync"]
        solution_summary: "ArgoCD upgrade is waiting on a pre-existing argocd-redis-secret-init PreSync Job or Chart.lock dependency drift."
        remediation_steps: ["Ensure redisSecretInit.podAnnotations includes sidecar.istio.io/inject: false in infrastructure/argocd/values.yaml.", "Delete the completed/stale argocd-redis-secret-init PreSync Job in namespace argocd and sync Chart.lock."]
        explicit_commands: ["kubectl get applications.argoproj.io -n argocd", "kubectl delete job argocd-redis-secret-init -n argocd --ignore-not-found", "python scripts/devops/swarm_dispatch.py upgrade-preflight"]
        required_it_tickets: ["IT-GITOPS-ARGOCD-01"]
  - system_id: "gitlab"
    label: "GitLab CE Source Control, Merge Requests & CI Runners"
    domain: "processes_workflows"
    epoch_introduced: 1
    k8s_namespace: "gitlab"
    argocd_app: "gitlab"
    git_manifest_path: "gitlab"
    primary_url: "https://gitlab.cluster.example.org/platform/infra-gitops/-/pipelines"
    control_plane_urls:
      pipelines: "https://gitlab.cluster.example.org/platform/infra-gitops/-/pipelines"
      merge_requests: "https://gitlab.cluster.example.org/platform/infra-gitops/-/merge_requests"
    human_monitoring_links:
      grafana_dashboard_url: "https://grafana.cluster.example.org/d/k8s-system-gitlab?var-namespace=gitlab&var-service=gitlab&from=now-1h&to=now"
      gitlab_source_and_pipelines_url: "https://gitlab.cluster.example.org/platform/infra-gitops/-/tree/main/gitlab?system=gitlab"
      herdr_agent_pane_link: "herdr://attach/subagent-flash38-kg-01?system=gitlab&cmd=hc+attach+subagent-flash38-kg-01"
      dependency_analyzer_url: "https://dependencies.cluster.example.org/?focusNode=sys-gitlab&system=gitlab&view=blast-radius"
      argocd_application_url: "https://argocd.cluster.example.org/applications/argocd/gitlab?view=tree&system=gitlab"
      security_dashboard_url: "https://opscryer.cluster.example.org/secops?system=gitlab&namespace=gitlab&scanner=sast-secret-detection"
      live_opscryer_debug_url: "https://opscryer.cluster.example.org/api/v1/system-context?system=gitlab&namespace=gitlab&debug=1"
    downstream_system_ids: ["harbor", "opscryer_hud"]
    playbooks:
      - playbook_id: "gitlab-mr-pipeline-or-conflict-blocker"
        title: "GitLab Merge Request Blocked by Conflict, Rebase, or Failed CI Job"
        symptom_keywords: ["merge conflict", "mr blocked", "pipeline failed", "commitlint", "cannot_be_merged", "gitlab runner"]
        solution_summary: "Open Merge Request is blocked by one of the 7 merge-blocking gates (conflict, rebase, or CI job failure)."
        remediation_steps: ["Run gitlab_ops.py mr blockers to inspect exact failed jobs and conflict status.", "Verify lowercase Conventional Commits and LF line endings before pushing."]
        explicit_commands: ["python scripts/devops/gitlab_ops.py mr list", "python scripts/devops/check_line_endings.py"]
        required_it_tickets: ["IT-CICD-GITLAB-01"]
      - playbook_id: "gitlab-recreate-rollout-503-or-puma-memory"
        title: "GitLab StrategyType Recreate Rollout 503 Window or Puma Worker Saturation"
        symptom_keywords: ["recreate rollout", "gitlab 503", "puma worker", "batched_background_migrations"]
        solution_summary: "GitLab uses StrategyType: Recreate (Rule 8), causing an expected 1-2 minute HTTP 503 window while the replacement pod initializes on nodegamma03."
        remediation_steps: ["Verify Deployment/gitlab rollout status in namespace gitlab on node nodegamma03.", "Confirm PostgreSQL batched_background_migrations have 0 non-finished rows."]
        explicit_commands: ["kubectl get pods -n gitlab -o wide", "kubectl rollout status deploy/gitlab -n gitlab --timeout=180s"]
        required_it_tickets: ["IT-CICD-GITLAB-02"]
  - system_id: "authentik"
