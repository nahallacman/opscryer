    playbooks:
      - playbook_id: "authentik-oidc-clock-skew-or-outpost-sync"
        title: "Authentik OIDC Token Rejected Due to NTP Clock Skew or Outpost Mismatch"
        symptom_keywords: ["iat is in the future", "clock skew", "jwt expired immediately", "token used before issued", "authentik outpost"]
        solution_summary: "Authentik IdP is healthy, but worker node chrony/NTP clock drifted >30s or OIDC outpost session requires refresh."
        remediation_steps: ["Verify chrony NTP synchronization across Kubernetes worker nodes via chronyc tracking.", "Inspect authentik-server and authentik-worker pods in namespace iam."]
        explicit_commands: ["kubectl get pods -n iam -l app.kubernetes.io/name=authentik", "chronyc tracking"]
        required_it_tickets: ["IT-IAM-NTP-01"]
