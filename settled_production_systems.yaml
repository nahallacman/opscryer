# Declarative Settled Production System Catalog (`.ai/graphify/settled_production_systems.yaml`)
schema_version: "SettledProductionSystemCatalog v1"
systems:
  - system_id: "harbor"
    label: "Harbor Container Registry & Trivy Scanner"
    domain: "deployments_services"
    epoch_introduced: 0
    k8s_namespace: "harbor"
    argocd_app: "harbor"
    git_manifest_path: "gitops/apps/harbor.yaml"
    primary_url: "https://harbor.cluster.example.org/harbor/projects"
    control_plane_urls:
      harbor_projects: "https://harbor.cluster.example.org/harbor/projects"
      harbor_health_api: "https://harbor.cluster.example.org/api/v2.0/health"
    human_monitoring_links:
      grafana_dashboard_url: "https://grafana.cluster.example.org/d/k8s-system-harbor?var-namespace=harbor&var-service=harbor&from=now-1h&to=now"
      gitlab_source_and_pipelines_url: "https://gitlab.cluster.example.org/platform/infra-gitops/-/tree/main/gitops/apps/harbor.yaml?system=harbor"
      herdr_agent_pane_link: "herdr://attach/subagent-flash38-kg-01?system=harbor&cmd=hc+attach+subagent-flash38-kg-01"
      dependency_analyzer_url: "https://dependencies.cluster.example.org/?focusNode=sys-harbor&system=harbor&view=blast-radius"
      argocd_application_url: "https://argocd.cluster.example.org/applications/argocd/harbor?view=tree&system=harbor"
      security_dashboard_url: "https://opscryer.cluster.example.org/secops?system=harbor&namespace=harbor&scanner=trivy-harbor"
      live_opscryer_debug_url: "https://opscryer.cluster.example.org/api/v1/system-context?system=harbor&namespace=harbor&debug=1"
    downstream_system_ids: ["openzfs_nas"]
    playbooks:
      - playbook_id: "harbor-redis-pool-exhausted"
        title: "Harbor Redis Session Pool Exhausted on High Concurrency Push"
        symptom_keywords: ["redis pool exhausted", "harbor core 504", "failed to get redis connection", "imagepushbackoff"]
        solution_summary: "Harbor core is reachable, but the Redis connection pool saturated during parallel image pushes."
        remediation_steps: ["Inspect Harbor Redis pod memory and active client connections in namespace harbor.", "Rollout restart deployment/harbor-core in namespace harbor to clear stale Redis sockets."]
        explicit_commands: ["kubectl get pods -n harbor -o wide", "kubectl logs -n harbor -l component=redis --tail=50", "kubectl rollout restart deploy/harbor-core -n harbor"]
        required_it_tickets: ["IT-SEC-HARBOR-01"]
      - playbook_id: "harbor-imagepullbackoff-robot-secret"
        title: "Kubernetes ImagePullBackOff on Internal Harbor Proxy"
        symptom_keywords: ["imagepullbackoff", "errimagepull", "harbor-pull-secret", "dockerhub-proxy"]
        solution_summary: "Target namespace is missing the Harbor robot pull secret or using an unproxied image path."
        remediation_steps: ["Verify imagePullSecrets in the target namespace references harbor-pull-secret.", "Use the internal proxy path harbor.cluster.example.org/dockerhub-proxy/<repo>:<tag>."]
        explicit_commands: ["kubectl get secret harbor-pull-secret -n default", "kubectl describe pod -l app -A"]
        required_it_tickets: ["IT-PLAT-REGISTRY-02"]
  - system_id: "openbao"
