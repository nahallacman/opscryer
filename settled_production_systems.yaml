    downstream_system_ids: []
    playbooks:
      - playbook_id: "openzfs-rwo-multiattach-or-nfs-estale"
        title: "OpenZFS PVC RWO Multi-Attach Lock or NFSv4 Stale File Handle (ESTALE)"
        symptom_keywords: ["multi-attach error", "volume is already exclusively attached", "stale file handle", "estale", "nfs mount input/output error"]
        solution_summary: "OpenZFS ZFS pool is ONLINE, but either a stale ReadWriteOnce VolumeAttachment lock remains or an NFSv4 handle became stale after ZFS snapshot rollback."
        remediation_steps: ["Inspect active Kubernetes VolumeAttachments and PVC events across namespaces.", "Ensure RWO workloads use StrategyType: Recreate and rollout restart pods with stale NFS handles."]
        explicit_commands: ["kubectl get volumeattachment", "kubectl get pvc -A", "kubectl get pods -n storage-system -o wide"]
        required_it_tickets: ["IT-STORAGE-RWO-01"]
