# SPDX-License-Identifier: Apache-2.0
name: PR Governance

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce PR title, LF line endings, public export scope, and OPSEC checks
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          errors = []

          # Require non-empty lowercase Conventional Commit PR title within 100 chars.
          title = os.environ.get("PR_TITLE", "").strip()
          title_re = re.compile(
              r"^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert|style)"
              r"(\([a-z0-9._/-]+\))?!?: [a-z0-9].*$"
          )
          if not title or len(title) > 100 or not title_re.match(title):
              errors.append(
                  f"PR title must match lowercase Conventional Commits (<=100 chars): {title!r}"
              )

          # Ensure GitLab-only CI config stays local to GitLab and never lands in GitHub.
          if Path(".gitlab-ci.yml").exists():
              errors.append(".gitlab-ci.yml must remain local to GitLab and not exist in this repository")

          base_ref = os.environ.get("BASE_REF", "main").strip() or "main"
          diff_range = f"origin/{base_ref}...HEAD"

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB", diff_range],
              text=True,
              encoding="utf-8",
          ).splitlines()

          for rel in changed:
              p = Path(rel)
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              if b"\x00" in raw:
                  continue
              if b"\r\n" in raw:
                  errors.append(f"CRLF line endings found in {rel}")

          # Split internal domain/subnet literals so the workflow itself never self-matches.
          leak_re = re.compile(
              r"(?i)(?:"
              + "ho" + r"me\.arpa"
              + "|"
              + "duck" + r"dns\.org"
              + r"|\b10\.10\.\d{1,3}\.\d{1,3}\b"
              + r"|\b192\.168\.\d{1,3}\.\d{1,3}\b"
              + ")"
          )
          patch = subprocess.check_output(
              ["git", "diff", "-U0", diff_range],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          cur_file = ""
          for line in patch.splitlines():
              if line.startswith("+++ b/"):
                  cur_file = line[6:]
                  continue
              # Scan only newly added content lines while ignoring diff file-header markers.
              if line.startswith("+") and not line.startswith("+++") and leak_re.search(line):
                  errors.append(f"Potential internal domain/LAN IP leak in added line of {cur_file}")

          if errors:
              for err in errors:
                  print(f"::error::{err}", file=sys.stderr)
              sys.exit(1)

          print(f"PR governance passed: {len(changed)} changed file(s) verified clean.")
          PYEOF
